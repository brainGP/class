<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Холбоо барих — Веб Хөгжүүлэлт</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.code-box {
  background: #0f172a;
  color: #22c55e;
  padding: 16px;
  border-radius: 10px;
  font-size: 13px;
  overflow-x: auto;
  font-family: monospace;
}
</style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

<header class="bg-white border-b border-gray-200 px-6 py-4">
  <div class="max-w-3xl mx-auto flex justify-between items-center">
    <h1 class="text-lg font-bold text-gray-900">Веб Хөгжүүлэлт</h1>
    <div class="flex gap-6 text-sm">
      <a href="../" class="text-gray-500 hover:text-blue-600">Нүүр</a>
      <a href="../homework/" class="text-gray-500 hover:text-blue-600">Даалгавар</a>
      <a href="../contact/" class="text-blue-600 font-medium">Холбоо барих</a>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-10">

  <a href="../" class="inline-flex items-center gap-2 text-sm text-blue-600 hover:underline mb-6">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
    </svg>
    Буцах
  </a>

  <div class="mb-8">
    <div class="flex items-center gap-3 mb-1">
      <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
      </svg>
      <h2 class="text-2xl font-bold text-gray-900">Холбоо барих</h2>
    </div>
    <p class="text-gray-500 text-sm">Багшийн мэдээлэл</p>
  </div>

  <!-- Нэр -->
  <section class="bg-white border border-gray-200 rounded-xl p-6 mb-4">
    <div class="flex items-center gap-2 mb-3">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
      </svg>
      <span class="text-sm font-medium text-gray-500">Нэр</span>
    </div>
    <div class="code-box">Bat-Orgil Erdenebold</div>
  </section>

  <!-- И-мэйл -->
  <section class="bg-white border border-gray-200 rounded-xl p-6 mb-4">
    <div class="flex items-center gap-2 mb-3">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
      </svg>
      <span class="text-sm font-medium text-gray-500">И-мэйл</span>
    </div>
    <div class="code-box flex items-center justify-between gap-4 flex-wrap">
      <span id="email">batorgilerdenebold@gmail.com</span>
      <div class="flex gap-2">
        <a href="mailto:batorgilerdenebold@gmail.com"
           class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs transition">
          Нээх
        </a>
        <button onclick="copyText('email')"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs transition">
          Хуулах
        </button>
      </div>
    </div>
  </section>

  <!-- Facebook -->
  <section class="bg-white border border-gray-200 rounded-xl p-6 mb-4">
    <div class="flex items-center gap-2 mb-3">
      <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/>
      </svg>
      <span class="text-sm font-medium text-gray-500">Facebook</span>
    </div>
    <div class="code-box flex items-center justify-between gap-4 flex-wrap">
      <span id="facebook" class="break-all text-sm">https://www.facebook.com/batorgil.erdenebold.7/</span>
      <div class="flex gap-2 flex-shrink-0">
        <a href="https://www.facebook.com/batorgil.erdenebold.7/" target="_blank"
           class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs transition">
          Нээх
        </a>
        <button onclick="copyText('facebook')"
          class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs transition">
          Хуулах
        </button>
      </div>
    </div>
  </section>

</main>

<footer class="text-center text-xs text-gray-400 py-8">
  Веб Хөгжүүлэлтийн Хичээл — 2026
</footer>

<script>
function copyText(id) {
  const text = document.getElementById(id).innerText.trim();
  navigator.clipboard.writeText(text);
  alert("Хуулагдлаа!");
}
</script>

</body>
</html>
