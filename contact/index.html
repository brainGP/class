<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Info</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>
function copyCode(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}
</script>

<style>
.code-box {
    background: #0f172a;
    color: #22c55e;
    padding: 16px;
    border-radius: 12px;
    font-size: 14px;
}
</style>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen text-gray-800">

<!-- Header -->
<header class="bg-white/80 backdrop-blur shadow-md p-4 sticky top-0 z-10">
  <div class="max-w-5xl mx-auto">
    <h1 class="font-bold text-2xl">Contact Information</h1>
  </div>
</header>

<!-- Back Button -->
<div class="max-w-5xl mx-auto pt-6 px-4">
  <a href="../" class="inline-flex items-center gap-2 text-blue-600 font-medium hover:gap-3 transition-all duration-300">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
    Back
  </a>
</div>

<!-- Contact Section -->
<section class="max-w-5xl mx-auto mt-8 bg-white p-8 rounded-2xl shadow-lg">

    <div class="space-y-6">

        <!-- Name -->
        <div>
            <span class="font-semibold block mb-2">Name</span>
            <div class="code-box">
                Bat-Orgil Erdenebold
            </div>
        </div>

        <!-- Email -->
      <div>
    <span class="font-semibold block mb-2">Email</span>
    <div class="code-box flex items-center justify-between gap-4">

        <a id="email">
           batorgilerdenebold@gmail.com
        </a>
<div class="flex gap-4">
        <a href="mailto:batorgilerdenebold@gmail.com" 
   id="email"
   class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm transition">
   Open
    </a>

        <button onclick="copyCode('email')" 
        class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition">
            Copy
        </button>
        </div>
    </div>
</div>

        <!-- Facebook -->
        <div>
            <span class="font-semibold block mb-2">Facebook</span>
            <div class="code-box flex items-center justify-between gap-4">
                <p id="facebook" class="break-all">
                    https://www.facebook.com/batorgil.erdenebold.7/
                </p>
                <div class="flex gap-4">
                <a href="https://www.facebook.com/batorgil.erdenebold.7/" target="_blank"
                class="px-4 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm transition">
                    Open
                </a>
                <button onclick="copyCode('facebook')" 
        class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition">
            Copy
        </button>
        </div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
