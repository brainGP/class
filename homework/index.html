<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework List</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.code-box {
    background: #0f172a;
    color: #22c55e;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    overflow-x: auto;
}
</style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

<header class="bg-white shadow p-4">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="font-bold text-xl">Homework</h1>
  
  </div>
</header>
<div class="max-w-6xl mx-auto pt-4">
      <a href="../" class="flex gap-2 text-blue-600 hover:scale-105 transition-all"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
</svg> <span>Back</span>
 </a>

</div>


<section class="max-w-6xl mx-auto mt-6 p-6 bg-white rounded shadow">
  <div id="weeks" class="grid gap-6 md:grid-cols-2"></div>
</section>

<script>
const weeks = [
  {
    title: "Week 4",
    link: "week-4/",
    desc: "Tailwind Grid Layout Practice",
    color: "blue",
    icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
             <rect width="7" height="7" x="3" y="3" rx="1"/>
             <rect width="7" height="7" x="14" y="3" rx="1"/>
             <rect width="7" height="7" x="14" y="14" rx="1"/>
             <rect width="7" height="7" x="3" y="14" rx="1"/>
           </svg>`
  },
  {
    title: "Week 5",
    link: "week-5/",
    desc: "Responsive Website Layout",
    color: "green",
    icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
             <path d="M4 6h16M4 12h16M4 18h16"/>
           </svg>`
  },
  {
    title: "Week 6",
    link: "week-6/",
    desc: "Coming Soon...",
    color: "purple",
    icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
             <circle cx="12" cy="12" r="10"/>
             <path d="M12 8v4l2 2"/>
           </svg>`
  }
];

const container = document.getElementById("weeks");

weeks.forEach(week => {
  container.innerHTML += `
    <a href="${week.link}" class="block p-6 bg-${week.color}-50 rounded-xl shadow hover:shadow-lg transition">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xl font-semibold">${week.title}</h3>
        ${week.icon}
      </div>
      <p>${week.desc}</p>
    </a>
  `;
});
</script>

</body>
</html>
