<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12-р долоо хоног — Бүтээгдэхүүн нэмэх систем</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.code-box {
  background: #0f172a;
  color: #22c55e;
  padding: 16px;
  border-radius: 10px;
  font-size: 13px;
  overflow-x: auto;
  font-family: monospace;
  line-height: 1.8;
  white-space: pre;
}
</style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

<header class="bg-white border-b border-gray-200 px-6 py-4">
  <div class="max-w-3xl mx-auto flex justify-between items-center">
    <h1 class="text-lg font-bold text-gray-900">Веб Хөгжүүлэлт</h1>
    <div class="flex gap-6 text-sm">
      <a href="../../" class="text-gray-500 hover:text-blue-600">Нүүр</a>
      <a href="../" class="text-blue-600 font-medium">Даалгавар</a>
      <a href="../../contact/" class="text-gray-500 hover:text-blue-600">Холбоо барих</a>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-10">

  <a href="../" class="inline-flex items-center gap-2 text-sm text-blue-600 hover:underline mb-6">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
    </svg>
    Буцах
  </a>

  <div class="mb-8">
    <div class="flex items-center gap-3 mb-1">
      <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/>
      </svg>
      <h2 class="text-2xl font-bold text-gray-900">12-р долоо хоног</h2>
    </div>
    <p class="text-gray-500 text-sm">Бүтээгдэхүүн нэмэх систем</p>
  </div>

  <section class="bg-white border border-gray-200 rounded-xl p-6 mb-5">
    <h3 class="font-bold text-gray-900 mb-3">Бүтээгдэхүүн нэмэх</h3>
    <p class="text-sm text-gray-600 mb-4">Product нэр, үнэ, description бичиж нэмнэ. Grid ашиглан responsive харуулна.</p>

    <!-- Form -->
    <div class="grid sm:grid-cols-4 gap-3 mb-6">
      <input class="name border border-gray-200 p-2 rounded-lg text-sm focus:outline-none focus:border-blue-400 col-span-1" placeholder="Бүтээгдэхүүн нэр">
      <input class="price border border-gray-200 p-2 rounded-lg text-sm focus:outline-none focus:border-blue-400" placeholder="Үнэ" type="number">
      <input class="desc border border-gray-200 p-2 rounded-lg text-sm focus:outline-none focus:border-blue-400" placeholder="Тайлбар">
      <button class="add bg-blue-500 text-white rounded-lg text-sm font-medium hover:bg-blue-600 transition py-2">
        Нэмэх
      </button>
    </div>

    <!-- Product grid -->
    <div class="list grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </section>

</main>

<footer class="text-center text-xs text-gray-400 py-8">
  Веб Хөгжүүлэлтийн Хичээл — 2026
</footer>

<script>
const name = document.querySelector(".name");
const price = document.querySelector(".price");
const desc = document.querySelector(".desc");
const add = document.querySelector(".add");
const list = document.querySelector(".list");

add.addEventListener("click", () => {
  const n = name.value.trim();
  const p = price.value.trim();
  const d = desc.value.trim();

  if (!n || !p || !d) return;

  const card = document.createElement("div");
  card.className = "p-4 bg-gray-50 border border-gray-200 rounded-xl hover:shadow-md transition";
  card.innerHTML = `
    <h3 class="font-bold text-gray-800 text-sm">${n}</h3>
    <p class="text-blue-600 font-semibold text-sm">$${p}</p>
    <p class="text-gray-500 text-xs mt-1">${d}</p>
  `;

  list.append(card);

  name.value = "";
  price.value = "";
  desc.value = "";
});
</script>

</body>
</html>
