<title>Week 5 Homework</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
function copyCode(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Code copied!");
}
</script>

<style>
.code-box {
    
    background: #0f172a;
    color: #22c55e;
    padding: 20px;

    overflow-x: auto;
}
</style>
