<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7-р долоо хоног — JavaScript Тооцоолуур</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.code-box {
  background: #0f172a;
  color: #22c55e;
  padding: 16px;
  border-radius: 10px;
  font-size: 13px;
  overflow-x: auto;
  font-family: monospace;
  line-height: 1.8;
  white-space: pre;
}
</style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">

<header class="bg-white border-b border-gray-200 px-6 py-4">
  <div class="max-w-3xl mx-auto flex justify-between items-center">
    <h1 class="text-lg font-bold text-gray-900">Веб Хөгжүүлэлт</h1>
    <div class="flex gap-6 text-sm">
      <a href="../../" class="text-gray-500 hover:text-blue-600">Нүүр</a>
      <a href="../" class="text-blue-600 font-medium">Даалгавар</a>
      <a href="../../contact/" class="text-gray-500 hover:text-blue-600">Холбоо барих</a>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-10">

  <a href="../" class="inline-flex items-center gap-2 text-sm text-blue-600 hover:underline mb-6">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
    </svg>
    Буцах
  </a>

  <div class="mb-8">
    <div class="flex items-center gap-3 mb-1">
      <svg class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"/>
      </svg>
      <h2 class="text-2xl font-bold text-gray-900">7-р долоо хоног</h2>
    </div>
    <p class="text-gray-500 text-sm">JavaScript үндэс — Тооцоолуур</p>
  </div>

  <section class="bg-white border border-gray-200 rounded-xl p-6 mb-5">
    <div class="flex items-center gap-2 mb-4">
      <svg class="w-5 h-5 text-yellow-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V13.5Zm0 2.25h.008v.008H8.25v-.008Zm2.25-4.5h.008v.008H10.5v-.008Zm0 2.25h.008v.008H10.5V13.5Zm0 2.25h.008v.008H10.5v-.008Zm2.25-4.5h.008v.008H12.75v-.008Zm0 2.25h.008v.008H12.75V13.5Zm0 2.25h.008v.008H12.75v-.008Zm2.25-4.5h.008v.008H15v-.008Zm0 2.25h.008v.008H15V13.5Zm0 2.25h.008v.008H15v-.008Zm2.25-4.5h.008v.008H17.25v-.008Zm0 2.25h.008v.008H17.25V13.5Zm0 2.25h.008v.008H17.25v-.008ZM6.75 6.75h.008v.008H6.75v-.008Zm0 2.25h.008v.008H6.75V9Zm0 2.25h.008v.008H6.75v-.008Zm2.25-4.5h.008v.008H9v-.008Zm0 2.25h.008v.008H9V9Zm0 2.25h.008v.008H9v-.008Zm2.25-4.5h.008v.008H11.25v-.008Zm0 2.25h.008v.008H11.25V9Zm0 2.25h.008v.008H11.25v-.008Zm2.25-4.5h.008v.008H13.5v-.008Zm0 2.25h.008v.008H13.5V9Zm0 2.25h.008v.008H13.5v-.008Zm2.25-4.5h.008v.008H15.75v-.008Zm0 2.25h.008v.008H15.75V9Zm0 2.25h.008v.008H15.75v-.008Zm2.25-4.5h.008v.008H18v-.008Zm0 2.25h.008v.008H18V9Zm0 2.25h.008v.008H18v-.008ZM5.25 6h13.5a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25H5.25a2.25 2.25 0 0 1-2.25-2.25v-9A2.25 2.25 0 0 1 5.25 6Z"/>
      </svg>
      <h3 class="font-bold text-gray-900">Тооцоолуур</h3>
    </div>

    <div class="flex gap-2 items-center flex-wrap">
      <input id="num1" type="number" placeholder="Тоо 1" class="flex-1 p-2 border border-gray-200 rounded-lg min-w-0 w-24 h-10 text-sm focus:outline-none focus:border-blue-400">

      <select id="operation" class="p-2 border border-gray-200 rounded-lg h-10 text-sm focus:outline-none focus:border-blue-400">
        <option value="+">+</option>
        <option value="-">-</option>
      </select>

      <input id="num2" type="number" placeholder="Тоо 2" class="flex-1 p-2 border border-gray-200 rounded-lg min-w-0 w-24 h-10 text-sm focus:outline-none focus:border-blue-400">

      <span class="text-gray-600 font-medium">=</span>

      <input id="result" type="text" placeholder="Үр дүн" class="flex-1 p-2 border border-gray-200 rounded-lg min-w-0 w-24 h-10 text-sm bg-gray-50 focus:outline-none" readonly>
    </div>

    <button onclick="calculate()" class="mt-4 bg-green-500 text-white px-5 py-2 rounded-lg text-sm hover:bg-green-600 transition">
      Тооцоолох
    </button>
  </section>

</main>

<footer class="text-center text-xs text-gray-400 py-8">
  Веб Хөгжүүлэлтийн Хичээл — 2026
</footer>

<script>
function calculate() {
  const n1 = parseFloat(document.getElementById('num1').value) || 0;
  const n2 = parseFloat(document.getElementById('num2').value) || 0;
  const op = document.getElementById('operation').value;
  let res = 0;
  if (op === '+') res = n1 + n2;
  if (op === '-') res = n1 - n2;
  document.getElementById('result').value = res;
}
</script>

</body>
</html>
