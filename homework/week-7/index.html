<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 7 – JavaScript Introduction</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
darkMode: "class"
}
</script>

<style>
.transition-colors{
transition:background-color .3s,color .3s;
}
</style>

</head>

<body class="bg-zinc-50 dark:bg-zinc-900 transition-colors">

<!-- HEADER -->

<header class="bg-white dark:bg-zinc-800 shadow py-4 sticky top-0 z-50 transition-colors">

<div class="max-w-6xl mx-auto flex justify-between">

<h1 class="font-bold text-xl dark:text-white">
Week 7 – JavaScript
</h1>
</div>

</header>

<!-- BACK -->

<div class="max-w-6xl mx-auto pt-6">

<a href="../"
class="inline-flex items-center gap-2 text-blue-600 font-medium hover:gap-3 transition-all duration-300">

← Back

</a>

</div>

<!-- MAIN CONTENT -->

<div class="max-w-6xl mx-auto mt-10 space-y-16 dark:text-zinc-200">
<section>
  <div class="flex gap-2 items-center">
    <input id="num1" type="number" placeholder="Тоo 1" class="flex-1 p-2 rounded w-24 h-12">
    
    <select id="operation" class="p-2 rounded">
      <option value="+">+</option>
      <option value="-">-</option>
    </select>

    <input id="num2" type="number" placeholder="Тоo 2" class="flex-1 p-2 rounded w-24 h-12">

    <span>=</span>

    <input id="result" type="text" placeholder="Үр дүн" class="flex-1 p-2 rounded w-24 h-12" readonly>
  </div>

  <button onclick="calculate()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 mt-4">
    Тооцоолох
  </button>

  <script>
    function calculate(){
      const n1 = parseFloat(document.getElementById('num1').value) || 0;
      const n2 = parseFloat(document.getElementById('num2').value) || 0;
      const op = document.getElementById('operation').value;
      let res = 0;
      if(op === '+') res = n1 + n2;
      if(op === '-') res = n1 - n2;
      document.getElementById('result').value = res;
    }
  </script>
</section>

</body>
</html>
