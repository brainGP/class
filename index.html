<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework List</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.code-box {
    background: #0f172a;
    color: #22c55e;
    padding: 16px;
    border-radius: 10px;
    font-size: 14px;
    overflow-x: auto;
}
</style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

<header class="bg-white shadow p-4">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="font-bold text-xl">Classes</h1>
<div class="flex gap-8">
<a href="./" class="text-blue-600 underline">Classes</a>
<a href="./homework/" class="text-blue-600 hover:underline">Homework</a>
<a href="./contact/" class="text-blue-600 hover:underline">Contact</a>
</div>
</div>
</header>


<section class="max-w-6xl mx-auto mt-6 p-6 bg-white rounded shadow">
  <div id="weeks" class="grid gap-6 md:grid-cols-2"></div>
</section>

<script>

  //HTML → CSS → Tailwind → JS basics → ES6 → DOM → Async JS → API → React → Node.js → Full projects
const weeks = [
  {
    title: "HTML and CSS",
    link: "html/",
    desc: "HTML and CSS",
    color: "blue",
    icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
             <rect width="7" height="7" x="3" y="3" rx="1"/>
             <rect width="7" height="7" x="14" y="3" rx="1"/>
             <rect width="7" height="7" x="14" y="14" rx="1"/>
             <rect width="7" height="7" x="3" y="14" rx="1"/>
           </svg>`
  },
  {
    title: "JavaScript",
    link: "javascript/",
    desc: "JavaScript",
    color: "green",
    icon: `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
             <path d="M4 6h16M4 12h16M4 18h16"/>
           </svg>`
  },
   {
    title: "JSON",
    link: "JSON/",
    desc: "JSON",
    color: "pink",
    icon: `<svg class="w-6 h-6 text-pink-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
</svg>
`
  },
   {
    title: "FETCH",
    link: "DATA/",
    desc: "ASYNC / AWAIT",
    color: "yellow",
    icon: `<svg class="w-6 h-6 text-yellow-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25M9 16.5v.75m3-3v3M15 12v5.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
</svg>
`
  },
];

const container = document.getElementById("weeks");

weeks.forEach(week => {
  container.innerHTML += `
    <a href="${week.link}" class="block p-6 bg-${week.color}-50 rounded-xl shadow hover:shadow-lg transition">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xl font-semibold">${week.title}</h3>
        ${week.icon}
      </div>
      <p>${week.desc}</p>
    </a>
  `;
});
</script>

</body>
</html>
